[project]
name = "paynudge"
version = "0.1.0"
description = "CLI tool to generate tiered payment reminder emails from invoice CSV. By Mourad.Soltani"
authors = [{name = "Mourad.Soltani"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
paynudge = "paynudge.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["paynudge*"]
